version: "3.9"

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: f1_mosquitto_broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  pitwall-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: f1_pitwall_service
    ports:
      - "5000:5000"
    volumes:
      - ./app.py:/app/app.py:ro
      - ./kpi_dashboard.html:/app/kpi_dashboard.html:ro
      - ./database_schema.html:/app/database_schema.html:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_TOPIC=telemetry/car/1
      - CAR_ID=F1-CAR-01
      - SIMULATOR_INTERVAL_SEC=0.5
      - PORT=5000
    depends_on:
      - mosquitto
    restart: unless-stopped
